<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DPP Autopilot · Recovery</title>
<style>:root{--bg:#07090d;--p:#0d1118;--line:#202936;--text:#eef3f8;--muted:#8c97a6;--green:#39d98a;--red:#ff6677}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:720px;margin:auto;padding:24px}.card{border:1px solid var(--line);background:var(--p);border-radius:16px;padding:18px;margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field-error{min-height:18px;margin-top:5px;color:var(--red);font-size:12px}input,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#111820;color:var(--text)}button{margin-top:10px;cursor:pointer;font-weight:700}.muted{color:var(--muted)}.ok{color:var(--green)}.bad{color:var(--red)}</style></head>
<body data-recovery-ready="false" data-recovery-session="missing" data-password-update="idle" data-input-preserved="unknown" data-form-valid="unknown">
<main class="shell"><a href="/demo/auth.html">← Authentication</a><h1>M01 · Password recovery completion</h1>
<p class="muted">This page accepts only a valid Supabase recovery session from the URL fragment. The token stays in memory and is never persisted.</p>
<section class="card"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="New password" aria-describedby="password_help password_error" aria-invalid="false"><div id="password_help" class="muted">Use at least 8 characters.</div><div id="password_error" class="field-error" aria-live="polite"></div></div><button id="save">Set new password</button></section>
<section class="card"><pre id="status" role="status" aria-live="polite">Checking recovery session…</pre></section>
</main>
<script src="/demo/form-ux.js"></script>
<script>
const formUx=window.DPPFormUX;
let cfg=null,accessToken=null;
function parseHash(){return Object.fromEntries(new URLSearchParams(location.hash.replace(/^#/,'')))}
function setState(msg,cls=''){status.className=cls;status.textContent=msg}
async function init(){
 cfg=await fetch('/data/auth-config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('auth config unavailable');return r.json()});
 const h=parseHash();
 const candidate=h.access_token||null;
 const expiresAt=Number(h.expires_at||0);
 const notExpired=!expiresAt || expiresAt*1000>Date.now();
 const isRecovery=h.type==='recovery' && !!candidate && notExpired;
 accessToken=isRecovery?candidate:null;
 history.replaceState(null,'',location.pathname+location.search);
 document.body.dataset.recoverySession=isRecovery?'valid':'missing';
 document.body.dataset.recoveryReady='true';
 setState(isRecovery?'Recovery session ready. Enter a new password.':'Missing, expired or invalid recovery session.',isRecovery?'ok':'bad');
}
save.onclick=async()=>{
 const before=formUx.snapshot([password]);
 const passwordOk=password.value.length>=8;
 formUx.setError(password,password_error,passwordOk?'':'Password must be at least 8 characters.');
 document.body.dataset.formValid=String(passwordOk);
 formUx.markPreserved(before,[password]);
 if(!accessToken){document.body.dataset.passwordUpdate='blocked';return setState('Recovery session required.','bad')}
 if(!passwordOk){document.body.dataset.passwordUpdate='blocked';return setState('Password must be at least 8 characters.','bad')}
 try{
  const r=await fetch(cfg.supabaseUrl+'/auth/v1/user',{
   method:'PATCH',
   headers:{'apikey':cfg.publishableKey,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
   body:JSON.stringify({password:password.value})
  });
  const body=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(body.msg||body.message||('HTTP '+r.status));
  accessToken=null;
  document.body.dataset.passwordUpdate='success';
  document.body.dataset.recoverySession='consumed';
  setState('Password updated successfully. Recovery token cleared from the URL.','ok');
 }catch(e){document.body.dataset.passwordUpdate='failed';setState(e.message,'bad')}
};
init().then(()=>{
 const q=new URLSearchParams(location.search);
 if(q.get('invalid')==='1'&&accessToken){
   password.value='short';
   save.click();
 }
}).catch(e=>{document.body.dataset.recoveryReady='true';setState(e.message,'bad')});
</script></body></html>
