<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPP CRYPTO Progress</title><style>body{font-family:system-ui;margin:32px;max-width:1000px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #ccc;border-radius:12px;padding:16px}.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:20px}.p{border:1px solid #ddd;border-radius:8px;padding:10px}code{overflow-wrap:anywhere}</style></head><body><header><div><h1>DPP CRYPTO</h1><p>Secure NFC workstream, evidence-backed status only.</p></div><strong id="pct">Loading evidence…</strong></header><div class="grid"><div class="card"><b>GREEN</b><div id="green">–</div></div><div class="card"><b>YELLOW</b><div id="yellow">–</div></div><div class="card"><b>BLOCKED</b><div id="blocked">–</div></div><div class="card"><b>PR</b><div><a href="https://github.com/SoulFlameAdmin/DPPautopilot/pull/242">#242</a></div></div></div><h2>Current</h2><p id="current"></p><p><b>Blocker:</b> <span id="blocker"></span></p><p><b>Branch:</b> <code>borko/dpp-security-lab</code></p><p><b>Latest commit:</b> <code id="commit"></code></p><div class="points" id="points"></div><script>fetch('../data/dpp-crypto-status.json').then(r=>r.json()).then(s=>{pct.textContent=s.percent_green+'% GREEN';green.textContent=s.counts.green;yellow.textContent=s.counts.yellow;blocked.textContent=s.counts.blocked;current.textContent=s.current;blocker.textContent=s.blocker.summary;commit.textContent=s.latest_commit;points.innerHTML=s.points.map(p=>'<div class="p"><b>'+p.id+'</b><br>'+p.status+'</div>').join('')}).catch(()=>{current.textContent='Status JSON unavailable. Open repository evidence.'})</script></body></html>
