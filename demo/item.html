<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DPP Autopilot · Battery Item Form</title>
  <style>
    :root{--bg:#07090d;--panel:#0d1118;--line:#202936;--text:#eef3f8;--muted:#8c97a6;--blue:#69a7ff;--green:#39d98a;--red:#ff5c6c;--yellow:#f7c948}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top a{color:#cbd7e5;text-decoration:none}.badge{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.14em;text-transform:uppercase}.notice{padding:10px 12px;border:1px solid #5a4930;background:#151108;border-radius:10px;color:#e8c982;margin:16px 0}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{border:1px solid #1b2533;border-radius:12px;padding:12px;background:#0a0e14}.field.full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:7px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.pill{font-size:10px;border:1px solid #2a3748;border-radius:999px;padding:3px 6px;color:#8fa0b4}.pill.req{color:var(--yellow)}input,textarea,select{width:100%;border:1px solid #2a3748;background:#080c12;color:var(--text);border-radius:9px;padding:9px;font:inherit}textarea{min-height:96px}.error{color:var(--red);font-size:11px;margin-top:6px;min-height:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#111722;color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}.btn.primary{background:#eef3f8;color:#090c11;font-weight:800}.result{margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}.result.ok{border-color:#245d43;color:var(--green)}.result.bad{border-color:#66303a;color:var(--red)}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.shell{padding:14px}}
  </style>
</head>
<body data-item-ready="false" data-item-valid="unknown">
<main class="shell">
  <div class="top"><div><div class="badge">DPP Autopilot · Demo</div><h1>Individual battery instance</h1></div><a href="/">← Dashboard</a></div>
  <div class="notice">Synthetic demo item. Model linkage and item-level requirements are validated locally; no backend write occurs.</div>
  <section class="card"><div class="actions"><button id="loadSample" class="btn" type="button">Зареди item #1</button><button id="validateButton" class="btn primary" type="button">Validate</button></div><div id="result" class="result">Зареждане…</div></section>
  <form id="itemForm" class="grid" novalidate>
    <div class="field full" data-field="model_link"><label for="modelLink">Linked battery model</label><div class="meta"><span class="pill req">required linkage</span></div><input id="modelLink" data-model-link type="text" readonly /><div class="error" data-error-for="model_link"></div></div>
  </form>
</main>
<script>
let fields=[];let fixture=null;let item=null;const allowedStatuses=['original','repurposed','re-used','remanufactured','waste'];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function getPath(obj,path){let cur=obj;for(const p of path.split('.')){if(cur==null||typeof cur!=='object'||!(p in cur))return undefined;cur=cur[p]}return cur}
function inputFor(f){const rel=f.path.replace(/^item\./,'');const id='f_'+rel.replace(/[^a-z0-9]+/gi,'_');const common=`id="${id}" data-path="${esc(rel)}" data-type="${esc(f.type)}" data-required="true"`;if(rel==='lifecycle_status')return `<select ${common}>${allowedStatuses.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>`;if(f.type==='object'||f.type==='array'||f.type==='document_ref_array')return `<textarea ${common}></textarea>`;if(f.type==='number'||f.type==='integer')return `<input ${common} type="number" step="any" />`;return `<input ${common} type="text" />`}
function render(){itemForm.insertAdjacentHTML('beforeend',fields.map(f=>`<div class="field ${['object','array','document_ref_array'].includes(f.type)?'full':''}" data-field="${esc(f.path)}"><label>${esc(f.path)}</label><div class="meta"><span class="pill">${esc(f.type)}</span><span class="pill">${esc(f.access)}</span><span class="pill req">required</span></div>${inputFor(f)}<div class="error" data-error-for="${esc(f.path)}"></div></div>`).join(''));document.body.dataset.itemReady='true';result.textContent=`Schema loaded: ${fields.length} item field groups`;}
function setValue(el,f,value){if(value===undefined||value===null){el.value='';return}if(['object','array','document_ref_array'].includes(f.type))el.value=JSON.stringify(value,null,2);else el.value=String(value)}
function loadSampleValues(){item=fixture.items[0];modelLink.value=fixture.model.identification.model_id;for(const f of fields){const rel=f.path.replace(/^item\./,'');const el=document.querySelector(`[data-path="${CSS.escape(rel)}"]`);setValue(el,f,getPath(item,rel))}result.className='result';result.textContent='Synthetic item #1 loaded.'}
function validate(){let errors=0;const expectedModel=fixture.model.identification.model_id;let message=modelLink.value===expectedModel?'':'Item must link to the loaded battery model';document.querySelector('[data-error-for="model_link"]').textContent=message;if(message)errors++;
 for(const f of fields){const rel=f.path.replace(/^item\./,'');const el=document.querySelector(`[data-path="${CSS.escape(rel)}"]`);const raw=el.value.trim();let msg='';if(!raw)msg='Required field';else if(rel==='unique_identifier'&&!raw.startsWith(`urn:dpp:demo:battery:${expectedModel}:`))msg='Identifier must be a demo URN linked to this model';else if(rel==='lifecycle_status'&&!allowedStatuses.includes(raw))msg='Invalid lifecycle status';else if(f.type==='integer'&&!Number.isInteger(Number(raw)))msg='Must be an integer';else if(['object','array','document_ref_array'].includes(f.type)){try{const v=JSON.parse(raw);if(f.type==='object'&&(typeof v!=='object'||Array.isArray(v)||v===null))msg='Must be a JSON object';if((f.type==='array'||f.type==='document_ref_array')&&!Array.isArray(v))msg='Must be a JSON array'}catch{msg='Invalid JSON'}}document.querySelector(`[data-error-for="${CSS.escape(f.path)}"]`).textContent=msg;if(msg)errors++}
 const ok=errors===0;document.body.dataset.itemValid=String(ok);document.body.dataset.errorCount=String(errors);document.body.dataset.modelLinked=String(modelLink.value===expectedModel);result.className='result '+(ok?'ok':'bad');result.textContent=ok?`VALID · model linked + ${fields.length} item groups checked`:`INVALID · ${errors} field error(s)`;return ok}
loadSample.addEventListener('click',loadSampleValues);validateButton.addEventListener('click',validate);
(async()=>{const [c,s]=await Promise.all([fetch('/data/dpp-field-catalog.json',{cache:'no-store'}),fetch('/data/sample-battery.json',{cache:'no-store'})]);if(!c.ok||!s.ok)throw new Error('schema/sample load failed');const catalog=await c.json();fixture=await s.json();fields=catalog.fields.filter(f=>f.path.startsWith('item.'));render();const q=new URLSearchParams(location.search);if(q.get('sample')==='1'||q.get('invalid')==='1')loadSampleValues();if(q.get('invalid')==='1')document.querySelector('[data-path="unique_identifier"]').value='BAD-ID';if(q.get('sample')==='1'||q.get('invalid')==='1')validate();})().catch(e=>{result.className='result bad';result.textContent=e.message;document.body.dataset.itemValid='false'});
</script>
</body>
</html>
