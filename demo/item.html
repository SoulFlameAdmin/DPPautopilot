<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DPP Autopilot · Battery Item Form</title>
  <link rel="stylesheet" href="/assets/csp/item.css">
</head>
<body data-item-ready="false" data-item-valid="unknown">
<main class="shell">
  <div class="top"><div><div class="badge">DPP Autopilot · Demo</div><h1>Individual battery instance</h1></div><a href="/">← Dashboard</a></div>
  <div class="notice">Synthetic demo item. Model linkage and item-level requirements are validated locally; no backend write occurs.</div>
  <section class="card"><div class="actions"><button id="loadSample" class="btn" type="button">Зареди item #1</button><button id="validateButton" class="btn primary" type="button">Validate</button></div><div id="result" class="result" role="status" aria-live="polite">Зареждане…</div></section>
  <form id="itemForm" class="grid" novalidate>
    <div class="field full" data-field="model_link"><label for="modelLink">Linked battery model</label><div class="meta"><span class="pill req">required linkage</span></div><input id="modelLink" data-model-link type="text" readonly aria-describedby="modelLink_error" aria-invalid="false" /><div id="modelLink_error" class="error" data-error-for="model_link" aria-live="polite"></div></div>
  </form>
</main>
<script src="/demo/async-state.js"></script>
<script src="/assets/csp/item-inline-1.js"></script>
<script src="/demo/responsive-probe.js"></script>
<script src="/demo/accessibility-probe.js"></script>
</body>
</html>
