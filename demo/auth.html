<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DPP Autopilot · Authentication</title>
<link rel="stylesheet" href="/assets/csp/auth.css">
</head>
<body data-auth-ready="false" data-session-state="unknown" data-input-preserved="unknown" data-form-valid="unknown">
<main class="shell"><a href="/">← Dashboard</a><h1>M01 · Authentication</h1>
<p class="muted">Supabase Auth client flow. Publishable key only; no service-role secret is present in the browser.</p>
<section class="card"><div class="grid"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="email@example.com" aria-describedby="email_help email_error" aria-invalid="false"><div id="email_help" class="muted">Use the account email address.</div><div id="email_error" class="field-error" aria-live="polite"></div></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-describedby="password_help password_error" aria-invalid="false"><div id="password_help" class="muted">Required for sign-up and sign-in.</div><div id="password_error" class="field-error" aria-live="polite"></div></div></div><div class="grid auth-actions"><button id="signup">Sign up</button><button id="signin">Sign in</button><button id="reset">Reset password</button><button id="signout">Sign out</button></div></section>
<section class="card"><strong>Session</strong><pre id="session" role="status" aria-live="polite">Loading…</pre></section><section class="card"><strong>Result</strong><pre id="result" role="status" aria-live="polite">Ready.</pre></section>
</main>
<script src="/demo/form-ux.js"></script>
<script src="/assets/csp/auth-inline-1.js"></script><script src="/demo/responsive-probe.js"></script>
<script src="/demo/accessibility-probe.js"></script>
</body></html>
