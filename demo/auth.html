<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPP Autopilot · Authentication</title>
<style>:root{--bg:#07090d;--p:#0d1118;--line:#202936;--text:#eef3f8;--muted:#8c97a6;--green:#39d98a;--amber:#ffbd52;--red:#ff6677}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:820px;margin:auto;padding:24px}.card{border:1px solid var(--line);background:var(--p);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#111820;color:var(--text)}button{cursor:pointer;font-weight:700}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:650px){.grid{grid-template-columns:1fr}.shell{padding:14px}}</style>
</head>
<body data-auth-ready="false" data-session-state="unknown">
<main class="shell"><a href="/">← Dashboard</a><h1>M01 · Authentication</h1>
<p class="muted">Supabase Auth client flow. Publishable key only; no service-role secret is present in the browser.</p>
<section class="card"><div class="grid"><input id="email" type="email" autocomplete="email" placeholder="email@example.com"><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><div class="grid" style="margin-top:12px"><button id="signup">Sign up</button><button id="signin">Sign in</button><button id="reset">Reset password</button><button id="signout">Sign out</button></div></section>
<section class="card"><strong>Session</strong><pre id="session">Loading…</pre></section><section class="card"><strong>Result</strong><pre id="result">Ready.</pre></section>
</main>
<script>
let cfg,accessToken=null,refreshToken=null;
const out=(x,cls='')=>{result.className=cls;result.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)};
async function call(path,{method='GET',body,token}={}){
 const headers={'apikey':cfg.publishableKey,'Content-Type':'application/json'};
 if(token) headers.Authorization='Bearer '+token;
 const r=await fetch(cfg.supabaseUrl+path,{method,headers,body:body?JSON.stringify(body):undefined});
 const text=await r.text();let data;try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
 if(!r.ok) throw Object.assign(new Error(data.msg||data.message||data.error_description||('HTTP '+r.status)),{status:r.status,data});
 return data;
}
function setSession(data){
 accessToken=data?.access_token||null;refreshToken=data?.refresh_token||null;
 document.body.dataset.sessionState=accessToken?'authenticated':'anonymous';
 session.textContent=accessToken?'Authenticated session in memory only.':'No authenticated session.';
}
async function init(){
 cfg=await fetch('/data/auth-config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('auth config unavailable');return r.json()});
 if(!cfg.supabaseUrl.startsWith('https://')||!cfg.publishableKey.startsWith('sb_publishable_')) throw new Error('invalid auth config');
 setSession(null);document.body.dataset.authReady='true';
}
signup.onclick=async()=>{try{const d=await call('/auth/v1/signup',{method:'POST',body:{email:email.value,password:password.value}});setSession(d);out(d.session?'Sign-up created authenticated session.':'Sign-up accepted; email confirmation is required by current project settings.','ok')}catch(e){out(e.message,'bad')}};
signin.onclick=async()=>{try{const d=await call('/auth/v1/token?grant_type=password',{method:'POST',body:{email:email.value,password:password.value}});setSession(d);out('Sign-in succeeded.','ok')}catch(e){out(e.message,'bad')}};
reset.onclick=async()=>{try{await call('/auth/v1/recover',{method:'POST',body:{email:email.value}});out('Password reset request accepted.','ok')}catch(e){out(e.message,'bad')}};
signout.onclick=async()=>{try{if(accessToken)await call('/auth/v1/logout',{method:'POST',token:accessToken});setSession(null);out('Signed out.','ok')}catch(e){setSession(null);out(e.message,'bad')}};
init().catch(e=>out(e.message,'bad'));
</script></body></html>
