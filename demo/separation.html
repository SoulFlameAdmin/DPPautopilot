<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPP Autopilot · Model / item separation</title>
<style>:root{--bg:#07090d;--p:#0d1118;--line:#202936;--text:#eef3f8;--muted:#8c97a6;--blue:#69a7ff;--green:#39d98a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid var(--line);background:var(--p);border-radius:16px;padding:18px}.tag{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--blue)}.item .tag{color:var(--green)}code{color:#c5d5e8}.row{border-top:1px solid var(--line);padding:9px 0}.muted{color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:14px}}</style>
</head>
<body data-separation-ready="false" data-model-paths="" data-item-paths="" data-cross-level-leak="unknown">
<main class="shell"><a href="/">← Dashboard</a><h1>Model vs individual battery data</h1><p class="muted">Shared model facts belong to the model; per-battery lifecycle/telemetry belongs to the item.</p><div class="grid"><section class="card"><div class="tag">MODEL LEVEL</div><h2 id="modelTitle">Loading…</h2><div id="modelRows"></div></section><section class="card item"><div class="tag">ITEM LEVEL</div><h2 id="itemTitle">Loading…</h2><div id="itemRows"></div></section></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const get=(o,p)=>{let c=o;for(const x of p.split('.')){if(c==null||typeof c!=='object'||!(x in c))return undefined;c=c[x]}return c};
(async()=>{try{
 const [cr,sr]=await Promise.all([fetch('/data/dpp-field-catalog.json'),fetch('/data/sample-battery.json')]);const c=await cr.json(),f=await sr.json(),item=f.items[0];
 const modelFields=c.fields.filter(x=>x.path.startsWith('model.')).slice(0,10), itemFields=c.fields.filter(x=>x.path.startsWith('item.'));
 modelTitle.textContent=f.model.identification.model_id;itemTitle.textContent=item.unique_identifier;
 modelRows.innerHTML=modelFields.map(x=>`<div class="row" data-model-path="${esc(x.path)}"><code>${esc(x.path)}</code><div>${esc(JSON.stringify(get(f,x.path)))}</div></div>`).join('');
 itemRows.innerHTML=itemFields.map(x=>`<div class="row" data-item-path="${esc(x.path)}"><code>${esc(x.path)}</code><div>${esc(JSON.stringify(get(item,x.path.slice(5))))}</div></div>`).join('');
 const modelPaths=modelFields.map(x=>x.path), itemPaths=itemFields.map(x=>x.path);
 const leak=modelPaths.some(p=>p.startsWith('item.'))||itemPaths.some(p=>p.startsWith('model.'));
 document.body.dataset.separationReady='true';document.body.dataset.modelPaths=String(modelPaths.length);document.body.dataset.itemPaths=String(itemPaths.length);document.body.dataset.crossLevelLeak=String(leak);
}catch(e){document.body.dataset.separationReady='false'}})();
</script></body></html>
