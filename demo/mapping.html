<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPP Autopilot · CSV mapping wizard</title>
<style>:root{--bg:#07090d;--p:#0d1118;--line:#202936;--text:#eef3f8;--muted:#8c97a6;--green:#39d98a;--amber:#ffbd52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:24px}.card{border:1px solid var(--line);background:var(--p);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:grid;grid-template-columns:minmax(180px,1fr) 1.6fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}select,input,button{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#111820;color:var(--text)}.ok{color:var(--green)}.warn{color:var(--amber)}.muted{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:700px){.row,.grid{grid-template-columns:1fr}.shell{padding:14px}}</style></head>
<body data-mapping-ready="false" data-header-count="0" data-mapped-count="0" data-payload-valid="false">
<main class="shell"><a href="/">← Dashboard</a><h1>M07 · CSV mapping wizard</h1><p class="muted">Synthetic sample → canonical DPP fields → reusable saved-mapping payload.</p>
<section class="card"><div class="grid"><input id="mappingName" value="Default CSV"><button id="autoload">Зареди synthetic sample</button></div><div id="rows"></div></section>
<section class="card"><h2>Saved mapping payload</h2><pre id="payload">Loading…</pre></section></main>
<script>
const canonical={
 manufacturer_name:'model.identification.manufacturer.name',
 model_id:'model.identification.model_id',
 category:'model.identification.category',
 rated_capacity_ah:'model.rated_capacity_ah',
 chemistry:'model.composition.chemistry',
 unique_identifier:'item.unique_identifier',
 lifecycle_status:'item.lifecycle_status',
 state_of_health_percent:'item.state_of_health.percent'
};
let headers=[],catalog=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(){
 const options=catalog.map(f=>`<option value="${esc(f.path)}">${esc(f.path)}</option>`).join('');
 rows.innerHTML=headers.map(h=>`<div class="row"><strong>${esc(h)}</strong><select data-source="${esc(h)}"><option value="">— unmapped —</option>${options}</select></div>`).join('');
 for(const sel of rows.querySelectorAll('select')){if(canonical[sel.dataset.source])sel.value=canonical[sel.dataset.source];sel.onchange=update}
 update();
}
function update(){
 const map={};for(const sel of rows.querySelectorAll('select'))if(sel.value)map[sel.dataset.source]=sel.value;
 const doc={name:mappingName.value.trim(),source_format:'csv',source_headers:headers,field_mapping:map};
 const valid=doc.name.length>0&&headers.length>0&&Object.keys(map).length===headers.length;
 document.body.dataset.headerCount=String(headers.length);document.body.dataset.mappedCount=String(Object.keys(map).length);document.body.dataset.payloadValid=String(valid);
 payload.textContent=JSON.stringify(doc,null,2);
}
async function load(){
 const [cr,csvr]=await Promise.all([fetch('/data/dpp-field-catalog.json',{cache:'no-store'}),fetch('/data/sample-import.csv',{cache:'no-store'})]);
 if(!cr.ok||!csvr.ok)throw new Error('catalog/sample load failed');
 catalog=(await cr.json()).fields;
 const first=(await csvr.text()).trim().split(/\r?\n/)[0];
 headers=first.split(',').map(x=>x.trim());
 render();document.body.dataset.mappingReady='true';
}
mappingName.oninput=update;autoload.onclick=load;
load().catch(e=>payload.textContent=e.message);
</script></body></html>
