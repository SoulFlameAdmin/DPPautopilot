<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DPP Autopilot · Нова парола</title><link rel="stylesheet" href="/assets/csp/company-auth.css"></head>
<body data-company-auth-ready="true"><main class="shell"><header class="topbar"><a class="brand" href="/">DPP AUTOPILOT</a><span class="badge">PASSWORD RESET</span></header>
<section class="card" id="resetCard"><div class="card-head"><div><p class="eyebrow">SECURE ACCOUNT RECOVERY</p><h1>Задай нова парола</h1></div><span class="state pending" id="resetState">ПРОВЕРКА…</span></div>
<p class="muted" id="resetEmail">Проверяваме recovery линка…</p><div class="form-grid">
<label><span>Нова парола</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Минимум 8 символа"></label>
<label><span>Повтори паролата</span><input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Повтори новата парола"></label></div>
<div class="actions"><button class="btn primary" id="updatePassword" type="button" disabled>Запази новата парола →</button><a class="btn" href="/company">Вход</a></div>
<div class="result" id="resetResult" role="status" aria-live="polite">Отвори страницата чрез recovery линка от email-а.</div></section></main>
<script src="/assets/csp/reset-password.js"></script></body></html>
