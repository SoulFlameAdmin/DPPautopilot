name: C04 Live Catalog Query Safety
on:
  pull_request:
    paths:
      - 'scripts/c04-live-catalog-readonly.sql'
      - 'docs/c04-live-catalog-evidence-20261010.md'
      - 'tests/api/c04-live-catalog-readonly.test.cjs'
      - '.github/workflows/c04-live-catalog-query-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-query-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed audit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prove no SQL mutation and consistent catalog coverage
        run: node --test tests/api/c04-live-catalog-readonly.test.cjs
