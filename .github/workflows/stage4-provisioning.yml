name: Stage 4 Provisioning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dpp_stage4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpp_stage4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Stage 4 contract
        run: python scripts/validate_stage4_provisioning.py

      - name: Run Stage 4 API tests
        run: node --test tests/api/provision.test.cjs

      - name: Replay migrations and run Stage 4 DB acceptance
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          PSQL=(psql -h 127.0.0.1 -U postgres -d dpp_stage4 -v ON_ERROR_STOP=1)
          "${PSQL[@]}" <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          SQL
          for file in supabase/migrations/*.sql; do
            echo "Replaying $file"
            "${PSQL[@]}" -f "$file"
          done
          "${PSQL[@]}" <<'SQL'
          begin;
          \i tests/db/test_scooter_provisioning_subset.sql
          rollback;
          SQL
