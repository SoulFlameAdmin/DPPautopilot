name: AI-first Intake Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run AI-first no-hallucination contract tests
        run: node --test tests/api/ai-intake-contract.test.cjs
