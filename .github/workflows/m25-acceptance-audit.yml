name: M25 acceptance audit

on:
  pull_request:
    paths:
      - 'data/master-plan.json'
      - 'data/m25-acceptance-audit.json'
      - 'scripts/generate_m25_acceptance_audit.py'
      - '.github/workflows/m25-acceptance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m25-acceptance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate M25 MVP acceptance audit
        run: python scripts/generate_m25_acceptance_audit.py
      - name: Upload M25 MVP acceptance audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m25-acceptance-audit
          path: artifacts/m25-acceptance-audit.json
          if-no-files-found: error
