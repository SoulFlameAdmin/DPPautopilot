name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dpp_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpp_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install D08 QR scanner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zbar-tools postgresql-client
          python -m pip install --disable-pip-version-check 'qrcode[pil]==8.2'
      - name: Validate repository contracts
        run: python scripts/validate_repo.py
      - name: Validate DPP field traceability catalog
        run: python scripts/validate_field_catalog.py
      - name: Validate M09 schema traceability
        run: python scripts/validate_schema_traceability.py
      - name: Validate M11 M14 database contracts
        run: python scripts/validate_history_lifecycle_contract.py
      - name: Validate M15 M16 registry workflow contract
        run: python scripts/validate_registry_workflow_contract.py
      - name: Validate M07 import mapping persistence contract
        run: python scripts/validate_import_mapping_contract.py
      - name: Validate M20 transactional import contract
        run: python scripts/validate_transactional_import_contract.py
      - name: Validate R01 environment and secret management
        run: python scripts/validate_env_secret_management.py
      - name: Validate D02 synthetic sample fixture
        run: python scripts/validate_sample_fixture.py
      - name: Validate D07 deterministic identifiers
        run: python scripts/validate_identifiers.py
      - name: Validate D09 completeness and D10 warnings
        run: python scripts/validate_completeness.py
      - name: Validate M04 core database schema contract
        run: python scripts/validate_core_schema_contract.py
      - name: Validate M06 migration ordering contract
        run: python scripts/validate_migration_workflow.py
      - name: Replay all DPP migrations on clean PostgreSQL 17
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          PSQL=(psql -h 127.0.0.1 -U postgres -d dpp_replay -v ON_ERROR_STOP=1)
          "${PSQL[@]}" <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          SQL
          for file in supabase/migrations/*.sql; do
            echo "Replaying $file"
            "${PSQL[@]}" -f "$file"
          done
          "${PSQL[@]}" <<'SQL'
          do $m06$
          declare
            expected text[] := array[
              'dpp_app_binding',
              'dpp_organizations',
              'dpp_organization_members',
              'dpp_battery_models',
              'dpp_battery_items',
              'dpp_passports'
            ];
            name text;
            has_rls boolean;
            grants_count integer;
            binding_count integer;
          begin
            foreach name in array expected loop
              if to_regclass('public.' || name) is null then
                raise exception 'M06 replay missing table %', name;
              end if;
              select c.relrowsecurity into has_rls
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname=name;
              if has_rls is not true then
                raise exception 'M06 replay table % does not have RLS enabled', name;
              end if;
            end loop;

            select count(*) into grants_count
            from information_schema.role_table_grants
            where table_schema='public'
              and table_name = any(expected)
              and grantee in ('anon','authenticated');
            if grants_count <> 0 then
              raise exception 'M06 replay leaked % anon/authenticated grants', grants_count;
            end if;

            select count(*) into binding_count
            from public.dpp_app_binding
            where app_key='dpp-autopilot'
              and repo_full_name='SoulFlameAdmin/DPPautopilot';
            if binding_count <> 1 then
              raise exception 'M06 replay binding row mismatch: %', binding_count;
            end if;
          end $m06$;
          SQL
          echo "M06_MIGRATION_REPLAY_PASS"
      - name: Validate M01 authentication client contract
        run: python scripts/validate_auth_contract.py
      - name: Check repository security hygiene
        run: python scripts/security_hygiene.py
      - name: Browser smoke test demo surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 8000 > /tmp/dpp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/data/master-plan.json >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for the UI smoke test" >&2
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --dump-dom 'http://127.0.0.1:8000/?plan=open' > artifacts/d01-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --window-size=1440,1000 --screenshot=artifacts/d01-dashboard.png \
            'http://127.0.0.1:8000/?plan=open'
          python scripts/ui_smoke.py artifacts/d01-dom.html artifacts/d01-dashboard.png

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --dump-dom 'http://127.0.0.1:8000/demo/import.html?sample=1' > artifacts/d03-import-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --window-size=1440,1000 --screenshot=artifacts/d03-import.png \
            'http://127.0.0.1:8000/demo/import.html?sample=1'
          python scripts/validate_import_demo.py artifacts/d03-import-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/model.html?sample=1' > artifacts/d04-model-valid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/model.html?invalid=1' > artifacts/d04-model-invalid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1200 --screenshot=artifacts/d04-model.png \
            'http://127.0.0.1:8000/demo/model.html?sample=1'
          python scripts/validate_model_form.py artifacts/d04-model-valid-dom.html artifacts/d04-model-invalid-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/item.html?sample=1' > artifacts/d05-item-valid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/item.html?invalid=1' > artifacts/d05-item-invalid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1100 --screenshot=artifacts/d05-item.png \
            'http://127.0.0.1:8000/demo/item.html?sample=1'
          python scripts/validate_item_form.py artifacts/d05-item-valid-dom.html artifacts/d05-item-invalid-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001' > artifacts/d06-passport-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3Amissing' > artifacts/d06-passport-missing-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1200 --screenshot=artifacts/d06-passport.png \
            'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001'
          python scripts/validate_public_passport.py artifacts/d06-passport-dom.html artifacts/d06-passport-missing-dom.html

          EXPECTED_QR_URL='http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001'
          python scripts/generate_qr_evidence.py --url "$EXPECTED_QR_URL" --png artifacts/d08-generated.png --svg artifacts/d08-generated.svg
          zbarimg --quiet --raw artifacts/d08-generated.png > artifacts/d08-generated-decoded.txt
          curl -fsS "$EXPECTED_QR_URL" > artifacts/d08-route.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --dump-dom 'http://127.0.0.1:8000/demo/qr.html' > artifacts/d08-qr-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --window-size=900,1000 --screenshot=artifacts/d08-qr.png \
            'http://127.0.0.1:8000/demo/qr.html'

          python - <<'PY'
          import base64, re
          from pathlib import Path
          dom = Path("artifacts/d08-qr-dom.html").read_text(encoding="utf-8")
          m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', dom)
          if not m:
              raise SystemExit("embedded D08 PNG data URI not found")
          Path("artifacts/d08-ui-qr.png").write_bytes(base64.b64decode(m.group(1)))
          PY
          zbarimg --quiet --raw artifacts/d08-ui-qr.png > artifacts/d08-ui-decoded.txt
          python scripts/validate_qr.py artifacts/d08-generated-decoded.txt artifacts/d08-ui-decoded.txt "$EXPECTED_QR_URL" artifacts/d08-qr-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/completeness.html' > artifacts/d09-complete-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/completeness.html?missing=manufacturerContact' > artifacts/d10-missing-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=900,1000 --screenshot=artifacts/d09-completeness.png \
            'http://127.0.0.1:8000/demo/completeness.html'
          python scripts/validate_completeness_ui.py artifacts/d09-complete-dom.html artifacts/d10-missing-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/separation.html' > artifacts/d11-separation-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=1000,900 --screenshot=artifacts/d11-separation.png \
            'http://127.0.0.1:8000/demo/separation.html'
          python scripts/validate_separation_ui.py artifacts/d11-separation-dom.html

          # D12 responsive evidence: render the core demo journey at phone/tablet/desktop widths.
          for SPEC in 'phone:390,844' 'tablet:768,1024' 'desktop:1440,1000'; do
            NAME="${SPEC%%:*}"
            SIZE="${SPEC#*:}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-dashboard.png" \
              'http://127.0.0.1:8000/'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-import.png" \
              'http://127.0.0.1:8000/demo/import.html?sample=1'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-model.png" \
              'http://127.0.0.1:8000/demo/model.html?sample=1'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-item.png" \
              'http://127.0.0.1:8000/demo/item.html?sample=1'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-passport.png" \
              'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-qr.png" \
              'http://127.0.0.1:8000/demo/qr.html'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-completeness.png" \
              'http://127.0.0.1:8000/demo/completeness.html'
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
              --window-size="$SIZE" --screenshot="artifacts/d12-${NAME}-separation.png" \
              'http://127.0.0.1:8000/demo/separation.html'
          done
          python scripts/validate_responsive_artifacts.py artifacts

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/replay.html?auto=1' > artifacts/d13-replay-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=900,900 --screenshot=artifacts/d13-replay.png \
            'http://127.0.0.1:8000/demo/replay.html?auto=1'
          python scripts/validate_replay_ui.py artifacts/d13-replay-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom 'http://127.0.0.1:8000/demo/acceptance.html' > artifacts/d14-acceptance-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --window-size=1000,1000 --screenshot=artifacts/d14-acceptance.png \
            'http://127.0.0.1:8000/demo/acceptance.html'
          python scripts/validate_demo_acceptance.py artifacts/d14-acceptance-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --dump-dom 'http://127.0.0.1:8000/demo/auth.html' > artifacts/m01-auth-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --window-size=900,900 --screenshot=artifacts/m01-auth.png \
            'http://127.0.0.1:8000/demo/auth.html'
          python scripts/validate_auth_ui.py artifacts/m01-auth-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/mapping.html' > artifacts/m07-mapping-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=1000,1000 --screenshot=artifacts/m07-mapping.png \
            'http://127.0.0.1:8000/demo/mapping.html'
          python scripts/validate_mapping_wizard.py artifacts/m07-mapping-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom 'http://127.0.0.1:8000/demo/import-validation.html' > artifacts/m08-import-validation-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --window-size=1100,1000 --screenshot=artifacts/m08-import-validation.png \
            'http://127.0.0.1:8000/demo/import-validation.html'
          python scripts/validate_import_validation_ui.py artifacts/m08-import-validation-dom.html
      - name: Upload demo UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ui-smoke
          path: artifacts/
          if-no-files-found: warn
