name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contracts
        run: python scripts/validate_repo.py
      - name: Validate DPP field traceability catalog
        run: python scripts/validate_field_catalog.py
      - name: Validate D02 synthetic sample fixture
        run: python scripts/validate_sample_fixture.py
      - name: Check repository security hygiene
        run: python scripts/security_hygiene.py
      - name: Browser smoke test demo surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 8000 > /tmp/dpp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/data/master-plan.json >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for the UI smoke test" >&2
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --dump-dom 'http://127.0.0.1:8000/?plan=open' > artifacts/d01-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --window-size=1440,1000 --screenshot=artifacts/d01-dashboard.png \
            'http://127.0.0.1:8000/?plan=open'
          python scripts/ui_smoke.py artifacts/d01-dom.html artifacts/d01-dashboard.png

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --dump-dom 'http://127.0.0.1:8000/demo/import.html?sample=1' > artifacts/d03-import-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 \
            --window-size=1440,1000 --screenshot=artifacts/d03-import.png \
            'http://127.0.0.1:8000/demo/import.html?sample=1'
          python scripts/validate_import_demo.py artifacts/d03-import-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/model.html?sample=1' > artifacts/d04-model-valid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/model.html?invalid=1' > artifacts/d04-model-invalid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1200 --screenshot=artifacts/d04-model.png \
            'http://127.0.0.1:8000/demo/model.html?sample=1'
          python scripts/validate_model_form.py artifacts/d04-model-valid-dom.html artifacts/d04-model-invalid-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/item.html?sample=1' > artifacts/d05-item-valid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/item.html?invalid=1' > artifacts/d05-item-invalid-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1100 --screenshot=artifacts/d05-item.png \
            'http://127.0.0.1:8000/demo/item.html?sample=1'
          python scripts/validate_item_form.py artifacts/d05-item-valid-dom.html artifacts/d05-item-invalid-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001' > artifacts/d06-passport-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --dump-dom 'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3Amissing' > artifacts/d06-passport-missing-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 \
            --window-size=1440,1200 --screenshot=artifacts/d06-passport.png \
            'http://127.0.0.1:8000/demo/passport.html?id=urn%3Adpp%3Ademo%3Abattery%3ANSD-EV-82-DEMO%3A000001'
          python scripts/validate_public_passport.py artifacts/d06-passport-dom.html artifacts/d06-passport-missing-dom.html
      - name: Upload demo UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ui-smoke
          path: artifacts/
          if-no-files-found: warn
