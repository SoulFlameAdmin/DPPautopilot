name: Cross-browser

on:
  pull_request:
    paths:
      - 'index.html'
      - 'demo/**'
      - 'tests/browser/**'
      - 'requirements-browser.txt'
      - '.github/workflows/cross-browser.yml'
      - 'scripts/validate_supply_chain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u06-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m pip_audit -r requirements-browser.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run U06 cross-browser core-flow matrix
        run: python tests/browser/test_cross_browser.py
      - name: Upload U06 cross-browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u06-cross-browser-report
          path: artifacts/u06-cross-browser-report.json
          if-no-files-found: warn
