name: C04 Owner Recovery Toolkit Safety
on:
  pull_request:
    paths:
      - 'scripts/c04-owner-recovery-toolkit.mjs'
      - 'docs/c04-owner-recovery-toolkit-no-execute-20261010.md'
      - 'tests/api/c04-owner-recovery-toolkit.test.cjs'
      - '.github/workflows/c04-owner-recovery-toolkit.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-execute-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run offline toolkit safety tests
        run: node --test tests/api/c04-owner-recovery-toolkit.test.cjs
      - name: Render non-executing recovery plan
        run: node scripts/c04-owner-recovery-toolkit.mjs plan > /tmp/c04-owner-recovery-plan.json
      - name: Freeze migration checksums in ephemeral CI temp only
        run: node scripts/c04-owner-recovery-toolkit.mjs migration-manifest supabase/migrations /tmp/c04-migration-sha256.json
