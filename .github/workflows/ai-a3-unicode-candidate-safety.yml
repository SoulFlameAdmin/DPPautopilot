name: AI A3 Unicode Candidate Safety
on:
  pull_request:
    paths:
      - 'api/_ai_document_intelligence.js'
      - 'tests/api/a3-evidence-safety.spec.cjs'
      - '.github/workflows/ai-a3-unicode-candidate-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a3-unicode-evidence-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run document evidence safety regression
        run: node --test tests/api/a3-evidence-safety.spec.cjs tests/api/a3-evidence-adapters.spec.cjs tests/api/document-intelligence-a3.spec.cjs
