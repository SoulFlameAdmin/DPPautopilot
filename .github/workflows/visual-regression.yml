name: Visual regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'demo/**'
      - 'data/u07-visual-baseline.json'
      - 'tests/browser/test_visual_regression.py'
      - 'requirements-browser.txt'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u07-visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned visual regression tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m pip_audit -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run U07 visual regression
        run: python tests/browser/test_visual_regression.py
      - name: Upload U07 visual regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u07-visual-regression
          path: artifacts/u07-visual-regression/
          if-no-files-found: error
