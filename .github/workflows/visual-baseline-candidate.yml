name: Visual baseline candidate

on:
  pull_request:
    paths:
      - 'index.html'
      - 'demo/**'
      - 'tests/browser/record_visual_baseline.py'
      - 'requirements-browser.txt'
      - '.github/workflows/visual-baseline-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u07-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned visual test tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m pip_audit -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Record U07 visual baseline candidate
        run: python tests/browser/record_visual_baseline.py
      - name: Upload U07 visual candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u07-visual-baseline-candidate
          path: artifacts/u07-candidate/
          if-no-files-found: error
