name: DB Regression Independent (NON RELEASE)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/db/**'
      - '.github/workflows/db-regression-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dpp_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpp_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - name: Checkout exact proposed SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify independent DB regression fileset
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tests/db/test_green_database_integrations.sql
            tests/db/test_registry_reliability_subset.sql
            tests/db/test_import_idempotency_subset.sql
            tests/db/test_registry_idempotency_subset.sql
            tests/db/test_optimistic_concurrency_subset.sql
            tests/db/test_transition_helper_search_path.sql
            tests/db/test_fk_covering_indexes.sql
            tests/db/test_import_error_contract_subset.sql
            tests/db/test_import_negative_validation_subset.sql
            tests/db/test_audit_log_subset.sql
            tests/db/test_m12_rbac_audit.sql
            tests/db/test_tenant_context_audit_subset.sql
            tests/db/test_public_private_runtime_subset.sql
            tests/db/test_tenant_rls_subset.sql
            tests/db/test_tenant_context_rbac_subset.sql
            tests/db/test_tenant_context_api_subset.sql
            tests/db/test_organization_onboarding_subset.sql
            tests/db/test_m03_authorization_context.sql
            tests/db/test_internal_rpc_surface_subset.sql
            tests/db/test_active_tenant_api_isolation_subset.sql
            tests/db/test_membership_revocation_isolation.sql
            tests/db/test_models_api_subset.sql
            tests/db/test_items_api_subset.sql
            tests/db/test_passports_api_subset.sql
            tests/db/test_imports_api_subset.sql
            tests/db/test_export_bundle_subset.sql
            tests/db/test_global_rls_grants_guard.sql
            tests/db/test_scooter_batch_provisioning_subset.sql
            tests/db/test_step19_completeness_workflow_subset.sql
            tests/db/test_security_definer_rpc_guard.sql
            tests/db/test_shared_rate_limit_backend.sql
            tests/db/test_evidence_attachments_subset.sql
            tests/db/test_evidence_storage_policy_subset.sql
            tests/db/test_retention_deletion_subset.sql
            tests/db/test_tenant_isolation_security_subset.sql
            tests/db/test_ai_intake_persistence_subset.sql
            tests/db/test_ai_conversation_cas_subset.sql
            tests/db/test_ai_manual_candidate_cas_subset.sql
            tests/db/test_ai_actor_bound_idempotency_subset.sql
            tests/db/test_ai_actor_bound_same_actor_retry_subset.sql
            tests/db/test_ai_actor_bound_rpc_surface_subset.sql
            tests/db/test_ai_actor_bound_race.sh
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "MISSING_DB_REGRESSION_FILE: $file"; exit 1; }
          done
          echo "DB_REGRESSION_FILESET_PASS count=${#required[@]}"

      - name: Bootstrap and replay all migrations on isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          PSQL=(psql -d dpp_replay -v ON_ERROR_STOP=1 -X)
          "${PSQL[@]}" <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          SQL
          count=0
          for file in supabase/migrations/*.sql; do
            echo "DB_REGRESSION_MIGRATION: $file"
            "${PSQL[@]}" -v pgaudit_available=off -v pg_cron_available=off -f "$file"
            count=$((count+1))
          done
          "${PSQL[@]}" <<'SQL'
          do $db_regression$
          declare
            expected text[] := array[
              'dpp_app_binding',
              'dpp_organizations',
              'dpp_organization_members',
              'dpp_battery_models',
              'dpp_battery_items',
              'dpp_passports'
            ];
            name text;
            has_rls boolean;
            grants_count integer;
            binding_count integer;
          begin
            foreach name in array expected loop
              if to_regclass('public.' || name) is null then
                raise exception 'DB regression replay missing table %', name;
              end if;
              select c.relrowsecurity into has_rls
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname=name;
              if has_rls is not true then
                raise exception 'DB regression replay table % does not have RLS enabled', name;
              end if;
            end loop;
            select count(*) into grants_count
            from information_schema.role_table_grants
            where table_schema='public'
              and table_name = any(expected)
              and grantee in ('anon','authenticated');
            if grants_count <> 0 then
              raise exception 'DB regression replay leaked % anon/authenticated table grants', grants_count;
            end if;
            select count(*) into binding_count
            from public.dpp_app_binding
            where app_key='dpp-autopilot'
              and repo_full_name='SoulFlameAdmin/DPPautopilot';
            if binding_count <> 1 then
              raise exception 'DB regression binding row mismatch: %', binding_count;
            end if;
          end $db_regression$;
          SQL
          echo "DB_MIGRATION_REPLAY_PASS count=$count"

      - name: Run current A2 actor-bound DB contracts on clean clone
        shell: bash
        run: |
          set -euo pipefail
          createdb -T dpp_replay dpp_ai_intake
          PSQL=(psql -d dpp_ai_intake -v ON_ERROR_STOP=1 -X)
          "${PSQL[@]}" <<'SQL'
          begin;
          \i tests/db/test_ai_intake_persistence_subset.sql
          rollback;
          begin;
          \i tests/db/test_ai_conversation_cas_subset.sql
          rollback;
          begin;
          \i tests/db/test_ai_manual_candidate_cas_subset.sql
          rollback;
          begin;
          \i tests/db/test_ai_actor_bound_idempotency_subset.sql
          rollback;
          begin;
          \i tests/db/test_ai_actor_bound_same_actor_retry_subset.sql
          rollback;
          begin;
          \i tests/db/test_ai_actor_bound_rpc_surface_subset.sql
          rollback;
          SQL
          bash tests/db/test_ai_actor_bound_race.sh
          echo "DB_A2_ACTOR_BOUND_PASS"

      - name: Run DB integration, idempotency and audit contracts
        shell: bash
        run: |
          set -euo pipefail
          run_file() { psql -d dpp_replay -v ON_ERROR_STOP=1 -X -f "$1"; }
          run_tx() {
            local file="$1"
            psql -d dpp_replay -v ON_ERROR_STOP=1 -X <<SQL
          begin;
          \i $file
          rollback;
          SQL
          }
          run_file tests/db/test_green_database_integrations.sql
          run_file tests/db/test_registry_reliability_subset.sql
          run_file tests/db/test_import_idempotency_subset.sql
          run_file tests/db/test_registry_idempotency_subset.sql
          run_tx tests/db/test_optimistic_concurrency_subset.sql
          run_file tests/db/test_transition_helper_search_path.sql
          run_file tests/db/test_fk_covering_indexes.sql
          run_file tests/db/test_import_error_contract_subset.sql
          run_file tests/db/test_import_negative_validation_subset.sql
          run_file tests/db/test_audit_log_subset.sql
          run_tx tests/db/test_m12_rbac_audit.sql
          run_tx tests/db/test_tenant_context_audit_subset.sql
          run_tx tests/db/test_public_private_runtime_subset.sql
          echo "DB_INTEGRATION_AUDIT_PASS"

      - name: Run tenant, RLS, RBAC and RPC security contracts
        shell: bash
        run: |
          set -euo pipefail
          run_file() { psql -d dpp_replay -v ON_ERROR_STOP=1 -X -f "$1"; }
          run_tx() {
            local file="$1"
            psql -d dpp_replay -v ON_ERROR_STOP=1 -X <<SQL
          begin;
          \i $file
          rollback;
          SQL
          }
          run_tx tests/db/test_tenant_rls_subset.sql
          run_tx tests/db/test_tenant_context_rbac_subset.sql
          run_tx tests/db/test_tenant_context_api_subset.sql
          run_tx tests/db/test_organization_onboarding_subset.sql
          run_tx tests/db/test_m03_authorization_context.sql
          run_tx tests/db/test_internal_rpc_surface_subset.sql
          run_tx tests/db/test_active_tenant_api_isolation_subset.sql
          run_tx tests/db/test_membership_revocation_isolation.sql
          run_tx tests/db/test_models_api_subset.sql
          run_tx tests/db/test_items_api_subset.sql
          run_tx tests/db/test_passports_api_subset.sql
          run_tx tests/db/test_imports_api_subset.sql
          run_tx tests/db/test_export_bundle_subset.sql
          run_file tests/db/test_global_rls_grants_guard.sql
          run_file tests/db/test_security_definer_rpc_guard.sql
          run_tx tests/db/test_tenant_isolation_security_subset.sql
          echo "DB_TENANT_SECURITY_PASS"

      - name: Run provisioning, evidence, retention and rate-limit contracts
        shell: bash
        run: |
          set -euo pipefail
          run_tx() {
            local file="$1"
            psql -d dpp_replay -v ON_ERROR_STOP=1 -X <<SQL
          begin;
          \i $file
          rollback;
          SQL
          }
          run_tx tests/db/test_scooter_batch_provisioning_subset.sql
          run_tx tests/db/test_step19_completeness_workflow_subset.sql
          run_tx tests/db/test_shared_rate_limit_backend.sql
          run_tx tests/db/test_evidence_attachments_subset.sql
          run_tx tests/db/test_evidence_storage_policy_subset.sql
          run_tx tests/db/test_retention_deletion_subset.sql
          echo "DB_PRODUCT_DATA_FLOWS_PASS"

      - name: Run isolated logical backup restore drill
        shell: bash
        run: |
          set -euo pipefail
          psql -d dpp_replay -v ON_ERROR_STOP=1 -X <<'SQL'
          insert into public.dpp_organizations(id,name,slug)
          values ('11111111-1111-4111-8111-111111111111','Restore Drill Org','restore-drill')
          on conflict do nothing;
          insert into public.dpp_battery_models(
            id,organization_id,model_identifier,manufacturer_name,category,canonical_data
          ) values (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'RESTORE-MODEL','Synthetic Restore Manufacturer','electric_vehicle','{"synthetic":true}'::jsonb
          ) on conflict do nothing;
          insert into public.dpp_battery_items(
            id,organization_id,model_id,unique_identifier,lifecycle_status,canonical_data
          ) values (
            '33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'urn:dpp:restore:000001','original','{"synthetic":true}'::jsonb
          ) on conflict do nothing;
          insert into public.dpp_passports(
            id,organization_id,battery_item_id,status,public_payload,private_payload
          ) values (
            '44444444-4444-4444-8444-444444444444',
            '11111111-1111-4111-8111-111111111111',
            '33333333-3333-4333-8333-333333333333',
            'draft','{"synthetic":true}'::jsonb,'{}'::jsonb
          ) on conflict do nothing;
          SQL
          docker run --rm --network host -e PGPASSWORD=postgres -v /tmp:/tmp postgres:17 \
            pg_dump -h 127.0.0.1 -U postgres -d dpp_replay -Fc -f /tmp/dpp-db-regression-restore.dump
          dropdb --if-exists dpp_restore
          createdb dpp_restore
          docker run --rm --network host -e PGPASSWORD=postgres -v /tmp:/tmp postgres:17 \
            pg_restore -h 127.0.0.1 -U postgres -d dpp_restore --no-owner --no-privileges /tmp/dpp-db-regression-restore.dump
          psql -d dpp_restore -v ON_ERROR_STOP=1 -X <<'SQL'
          do $restore$
          declare
            orgs integer;
            models integer;
            items integer;
            passports integer;
            linked integer;
            binding_count integer;
            rls_missing integer;
          begin
            select count(*) into orgs from public.dpp_organizations where slug='restore-drill';
            select count(*) into models from public.dpp_battery_models where model_identifier='RESTORE-MODEL';
            select count(*) into items from public.dpp_battery_items where unique_identifier='urn:dpp:restore:000001';
            select count(*) into passports from public.dpp_passports where id='44444444-4444-4444-8444-444444444444';
            select count(*) into linked
            from public.dpp_passports p
            join public.dpp_battery_items i on i.id=p.battery_item_id
            where p.id='44444444-4444-4444-8444-444444444444'
              and i.unique_identifier='urn:dpp:restore:000001';
            select count(*) into binding_count
            from public.dpp_app_binding
            where app_key='dpp-autopilot' and repo_full_name='SoulFlameAdmin/DPPautopilot';
            select count(*) into rls_missing
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public'
              and c.relname in ('dpp_organizations','dpp_battery_models','dpp_battery_items','dpp_passports')
              and c.relrowsecurity is not true;
            if orgs<>1 or models<>1 or items<>1 or passports<>1 or linked<>1 then
              raise exception 'DB restore integrity mismatch org=% model=% item=% passport=% linked=%',
                orgs,models,items,passports,linked;
            end if;
            if binding_count<>1 then
              raise exception 'DB restore binding row missing';
            end if;
            if rls_missing<>0 then
              raise exception 'DB restore RLS missing on % core tables',rls_missing;
            end if;
          end $restore$;
          SQL
          echo "DB_ISOLATED_RESTORE_PASS"

      - name: Emit independent DB regression marker
        run: |
          echo 'DB_REGRESSION_PASS'
          echo 'NON_RELEASE_ONLY: this proves disposable PostgreSQL 17 contracts, not C04 production deployment or real backup recovery.'
